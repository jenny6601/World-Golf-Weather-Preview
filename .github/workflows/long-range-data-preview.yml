name: Long-range golf weather data preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch raw long-range data
        run: |
          python scripts/fetch_long_range.py \
            --courses data/long-range/courses.example.json \
            --output build/long-range
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: long-range-weather-preview
          path: build/long-range/
          if-no-files-found: error
          retention-days: 7
